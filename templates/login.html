<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Login | BookNook</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon/favicon.ico">
    <style>
        :root {
            --bg: #f5f3ef;
            --surface: #ffffff;
            --border: #e0dbd3;
            --text: #1a1814;
            --text-muted: #7a7570;
            --accent: #2d5a3d;
            --radius: 10px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; box-shadow: 0 12px 40px rgba(0,0,0,0.08); }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--accent); margin-bottom: 18px; display: inline-block; }
        .heading { font-size: 1.1rem; margin-bottom: 14px; color: var(--text-muted); }
        .input { width: 100%; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; background: var(--bg); color: var(--text); }
        .btn { width: 100%; border: none; border-radius: var(--radius); padding: 12px 14px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
        .text-link { display: block; margin-top: 14px; text-align: center; color: var(--accent); text-decoration: none; }
        .flash { margin-bottom: 16px; color: #b03a3a; font-size: 0.95rem; }
    </style>
</head>
<body>
    <div class="card">
        <span class="logo">BookNook</span>
        <p class="heading">Login to your reading dashboard</p>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}
        <form action="{{ url_for('login') }}" method="post">
            <input type="text" name="username" placeholder="Username" class="input" required>
            <input type="password" name="password" placeholder="Password" class="input" required>
            <button type="submit" class="btn">Login</button>
        </form>
        <a href="{{ url_for('signup') }}" class="text-link">Don't have an account? Sign up</a>
    </div>
</body>
</html>
